<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Ribbons | Lab — Oli Mebberson</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Recursive:wght@400;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="icon" href="../../images/favicon.png?v=2" type="image/png">
    <style>
        body { background: #050510; overflow: hidden; }
        .lab-canvas-wrap { background: radial-gradient(ellipse at 50% 40%, #0f172a 0%, #050510 70%); }
        #preview {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        .lab-status {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 15px; z-index: 50;
            pointer-events: none;
            text-align: center;
            line-height: 1.5;
            max-width: 320px;
        }
        .lab-status.hidden { opacity: 0; }
    </style>
</head>
<body class="lab-page">
    <a href="../../#lab" class="lab-back">← Lab</a>
    <div class="lab-canvas-wrap">
        <video id="preview" playsinline autoplay muted></video>
        <canvas id="canvas" class="lab-canvas-fill"></canvas>
    </div>
    <p id="status" class="lab-status">Starting camera&hellip;</p>
    <div class="lab-controls">
        <p class="lab-hint">Only extended fingers paint — curl them to stop</p>
    </div>

    <script type="module">
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

        const video = document.getElementById('preview');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');

        // tip, pip, mcp for each finger (thumb uses ip as "pip")
        const fingers = [
            { tip: 4, pip: 3, mcp: 2, hue: 195 },
            { tip: 8, pip: 6, mcp: 5, hue: 210 },
            { tip: 12, pip: 10, mcp: 9, hue: 225 },
            { tip: 16, pip: 14, mcp: 13, hue: 240 },
            { tip: 20, pip: 18, mcp: 17, hue: 255 }
        ];
        const trails = Array.from({ length: 10 }, () => []);
        const smooth = Array.from({ length: 10 }, () => null);
        const MAX = 36;

        let landmarker = null;
        let stream = null;
        let running = false;
        let lastVideoTime = -1;

        function setStatus(text) {
            status.textContent = text;
            status.classList.remove('hidden');
        }

        function hideStatus() {
            status.classList.add('hidden');
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function lerp(a, b, t) { return a + (b - a) * t; }

        function dist(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        // Only paint when fingertip is clearly extended past the knuckle
        function isExtended(lm, finger, isThumb) {
            const tip = lm[finger.tip];
            const pip = lm[finger.pip];
            const mcp = lm[finger.mcp];
            const wrist = lm[0];
            const palm = lm[9]; // middle finger MCP ≈ palm centre

            if (isThumb) {
                // Thumb is sideways — compare tip vs MCP relative to palm, not wrist distance
                const tipPalm = dist(tip, palm);
                const mcpPalm = dist(mcp, palm);
                const tipMcp = dist(tip, mcp);
                const pipMcp = dist(pip, mcp);
                // Extended: tip clearly past MCP and farther from palm than MCP is
                return tipMcp > pipMcp * 1.45 && tipPalm > mcpPalm * 1.12;
            }

            const dTip = dist(tip, wrist);
            const dPip = dist(pip, wrist);
            const dMcp = dist(mcp, wrist);
            return dTip > dPip * 1.08 && dTip > dMcp * 1.12;
        }

        async function createLandmarker(delegate) {
            const vision = await FilesetResolver.forVisionTasks(
                'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
            );
            return HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                    delegate
                },
                runningMode: 'VIDEO',
                numHands: 2
            });
        }

        async function init() {
            setStatus('Loading hand tracking model…');
            try {
                landmarker = await createLandmarker('GPU');
            } catch (gpuErr) {
                console.warn('GPU delegate failed, using CPU', gpuErr);
                landmarker = await createLandmarker('CPU');
            }

            setStatus('Starting camera…');
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            video.srcObject = stream;
            video.playsInline = true;
            video.muted = true;
            await video.play();

            await new Promise((resolve, reject) => {
                const done = () => {
                    if (video.videoWidth > 0 && video.videoHeight > 0) resolve();
                };
                if (video.readyState >= 2) return done();
                video.addEventListener('loadeddata', done, { once: true });
                video.addEventListener('error', () => reject(new Error('video error')), { once: true });
                setTimeout(() => reject(new Error('video timeout')), 8000);
            });

            running = true;
            hideStatus();
            requestAnimationFrame(loop);
        }

        function drawVideoBg() {
            if (video.readyState < 2) return;
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const cw = canvas.width;
            const ch = canvas.height;
            const scale = Math.max(cw / vw, ch / vh);
            const dw = vw * scale;
            const dh = vh * scale;
            ctx.save();
            ctx.globalAlpha = 0.18;
            ctx.translate(cw, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, (cw - dw) * 0.5, (ch - dh) * 0.5, dw, dh);
            ctx.restore();
        }

        function addPoint(i, x, y) {
            const t = trails[i];
            const last = t[t.length - 1];
            if (last) {
                const gap = Math.hypot(x - last.x, y - last.y);
                if (gap > 8) {
                    const n = Math.min(2, Math.ceil(gap / 14));
                    for (let s = 1; s <= n; s++) {
                        const k = s / (n + 1);
                        t.push({ x: lerp(last.x, x, k), y: lerp(last.y, y, k) });
                    }
                }
            }
            t.push({ x, y });
            if (t.length > MAX) t.shift();
        }

        function fadeTrail(i) {
            if (trails[i].length) trails[i].shift();
            if (!trails[i].length) smooth[i] = null;
        }

        function drawTrail(trail, hue) {
            if (trail.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(trail[0].x, trail[0].y);
            for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
            ctx.strokeStyle = 'hsla(' + hue + ',92%,74%,0.9)';
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            const end = trail[trail.length - 1];
            ctx.fillStyle = 'hsla(' + hue + ',100%,85%,1)';
            ctx.beginPath();
            ctx.arc(end.x, end.y, 7, 0, Math.PI * 2);
            ctx.fill();
        }

        function detectHands() {
            if (!landmarker || video.readyState < 2) return null;

            const t = video.currentTime;
            if (t === lastVideoTime) return null;
            lastVideoTime = t;

            const active = new Set();
            const result = landmarker.detectForVideo(video, performance.now());
            if (!result.landmarks || !result.landmarks.length) return active;

            result.landmarks.forEach((lm, hand) => {
                fingers.forEach((finger, fi) => {
                    const i = hand * 5 + fi;
                    if (!isExtended(lm, finger, fi === 0)) {
                        fadeTrail(i);
                        return;
                    }

                    active.add(i);
                    const p = lm[finger.tip];
                    const tx = (1 - p.x) * canvas.width;
                    const ty = p.y * canvas.height;
                    if (!smooth[i]) smooth[i] = { x: tx, y: ty };
                    smooth[i].x = lerp(smooth[i].x, tx, 0.5);
                    smooth[i].y = lerp(smooth[i].y, ty, 0.5);
                    addPoint(i, smooth[i].x, smooth[i].y);
                });
            });
            return active;
        }

        function loop() {
            if (!running) return;
            requestAnimationFrame(loop);

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(5,5,16,0.18)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawVideoBg();

            const active = detectHands();
            if (active) {
                for (let i = 0; i < 10; i++) {
                    if (!active.has(i)) fadeTrail(i);
                }
            }

            ctx.globalCompositeOperation = 'lighter';
            trails.forEach((t, i) => {
                if (t.length > 1) drawTrail(t, fingers[i % 5].hue);
            });
        }

        document.addEventListener('visibilitychange', () => {
            running = !document.hidden;
            if (running) {
                lastVideoTime = -1;
                requestAnimationFrame(loop);
            }
        });
        window.addEventListener('pagehide', () => {
            running = false;
            if (stream) stream.getTracks().forEach((t) => t.stop());
        });

        init().catch((err) => {
            console.error(err);
            setStatus('Camera or hand tracking failed — allow camera access and refresh.');
        });
    </script>
</body>
</html>
